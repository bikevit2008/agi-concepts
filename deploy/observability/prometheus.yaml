global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Metrics exported by the OTel collector's prometheus exporter
  - job_name: "consciousness-otel"
    static_configs:
      - targets: ["otel-collector:8889"]

  # Tempo self-metrics
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
