# Production observability stack for the consciousness system.
#
# Usage:
#   cd deploy/observability
#   docker-compose up -d
#
# Grafana:     http://localhost:3000  (anonymous admin; change for prod)
# Tempo:       otel-collector forwards here on :4317
# Prometheus:  http://localhost:9090
# Collector:   OTel gRPC on :4317 (consciousness config points here)
#
# The consciousness app needs:
#   flags: observability_enabled=true, otel_enabled=true
#   settings.observability.otel_endpoint: http://localhost:4317

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector — receives OTLP from the consciousness process,
  # forwards traces to Tempo and metrics to Prometheus.
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
    depends_on:
      - tempo
      - prometheus
    networks: [consciousness-obs]

  # ---------------------------------------------------------------------------
  # Grafana Tempo — distributed traces store.
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # HTTP query
      - "9095:9095"   # gRPC query
    networks: [consciousness-obs]

  # ---------------------------------------------------------------------------
  # Prometheus — metrics storage; scrapes collector's Prometheus exporter.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=14d"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [consciousness-obs]

  # ---------------------------------------------------------------------------
  # Grafana — dashboards + datasources provisioned from disk.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - tempo
      - prometheus
    networks: [consciousness-obs]

networks:
  consciousness-obs:
    driver: bridge

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
