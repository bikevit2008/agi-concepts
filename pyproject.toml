[project]
name = "agi-consciousness"
version = "0.1.0"
description = "Processual consciousness model — multi-agent system with runtime states, hysteresis, and event loop"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.5.16",
    "openai>=1.60.0",
    "textual>=8.2.0",
    "structlog>=25.0.0",
    "pyyaml>=6.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
persistence = ["lancedb>=0.15"]
bus = ["nats-py>=0.0.5"]
observability = [
    "rerun-sdk>=0.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
hysteresis = [
    "jax>=0.4.20",
    "diffrax>=0.5.0",
    "equinox>=0.11.0",
]
ml = [
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]
all = [
    "agi-consciousness[persistence,bus,observability,hysteresis,ml]",
]

[project.scripts]
consciousness = "src.main:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
