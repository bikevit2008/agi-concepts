[project]
name = "agi-consciousness"
version = "0.1.0"
description = "Processual consciousness model — multi-agent system with runtime states, hysteresis, and event loop"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.6.5",
    "openai>=1.60.0",
    "textual>=8.2.0",
    "structlog>=25.0.0",
    "pyyaml>=6.0",
    "rich>=14.0.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
core = []
persistence = []
memory-local = []
memory-full = [
    "lancedb>=0.15",
    "pyarrow>=16",
    "sentence-transformers>=3.0",
    "hdbscan>=0.8.38",
    "numpy>=1.26",
]
memory = [
    "agi-consciousness[memory-full]",
]
bus = ["nats-py>=0.0.5"]
observability = [
    "rerun-sdk>=0.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
hysteresis = [
    "jax>=0.4.20",
    "diffrax>=0.5.0",
    "equinox>=0.11.0",
]
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]
tools = [
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "testcontainers>=4.8",
]
mvp-local = [
    "agi-consciousness[persistence,memory-local]",
]
mvp-full = [
    "agi-consciousness[persistence,memory-full,bus,observability,ml,tools]",
]
all = [
    "agi-consciousness[mvp-full,hysteresis,dev]",
]

[project.scripts]
consciousness = "src.main:main"

[tool.pytest.ini_options]
markers = [
    "docker: integration tests that require a running Docker daemon",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
