[project]
name = "agi-consciousness"
version = "0.1.0"
description = "Processual consciousness model — multi-agent system with runtime states, hysteresis, and event loop"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.5.16",
    "openai>=1.60.0",
    "textual>=8.2.0",
    "structlog>=25.0.0",
    "pyyaml>=6.0",
    "rich>=14.0.0",
]

[project.optional-dependencies]
persistence = [
    "lancedb>=0.15",
    "pyarrow>=16",
]
memory = [
    "lancedb>=0.15",
    "pyarrow>=16",
    "sentence-transformers>=3.0",
]
bus = ["nats-py>=0.0.5"]
observability = [
    "rerun-sdk>=0.20",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
]
hysteresis = [
    "jax>=0.4.20",
    "diffrax>=0.5.0",
    "equinox>=0.11.0",
]
ml = [
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]
tools = [
    "requests>=2.31",
]
all = [
    "agi-consciousness[persistence,memory,bus,observability,hysteresis,ml,tools]",
]

[project.scripts]
consciousness = "src.main:main"

[tool.pytest.ini_options]
markers = [
    "docker: integration tests that require a running Docker daemon",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
